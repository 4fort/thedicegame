<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Game</title>
  </head>
  <!-- <link rel="stylesheet" href="main.css" /> -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="keyframes.css" />
  <body>

        <button onclick="perfectKoSir_omsim()">Yes</button>

    <div class="title">
      <h1>The Dice Game</h1>
      <span id="gameCreator">By: Dexter Fort Silva</span>
    </div>

    <div id="gameStart">
      <div id="gameStartMenu">
        <h1>Select Game Mode</h1>
        <div id="gameStartButtons">
          <button id="game1" onclick="gameModeSelect('game1')">
            <h2>5</h2>
            rolls,<span> 1 </span>to score
          </button>
          <button id="game2" onclick="gameModeSelect('game2')">
            <h2>7</h2>
            rolls,<span> 3 </span>to score
          </button>
          <button id="game3" onclick="gameModeSelect('game3')">
            <h2>Spin indefinitely</h2>
          </button>
        </div>
      </div>
    </div>

    <div id="gameResults">
      <div id="gameRestart"></div>
    </div>

    <div id="hud">
      <div id="score"></div>
      <div id="numberOfTries"></div>
      <table id="checkboardTable">
        <thead>
          <tr>
            <th>Dice sides</th>
            <th>Guesses</th>
          </tr>
        </thead>
        <tbody id="checkboard"></tbody>
      </table>
    </div>
    <div id="winNumLog"></div>

    <div class="diceContainer">
      <div id="emotes"></div>
      <div class="dice" onclick="diceRoll()"></div>
    </div>

    <h1 id="guessCorrectOrNot"></h1>
    <div id="guessLog"></div>

    <div id="guideControls">
      <div id="keyGuide"></div>
      <span>/</span>
      <div id="touchGuide">
        <img src="assets/touch.png" alt="" />
      </div>
    </div>
    <div id="guessButtonContainer"></div>

    <div id="blackBars">
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div id="gameDebug"></div>
    <div id="gameVersion" />
  </body>
  <script src="main.js"></script>
</html>
